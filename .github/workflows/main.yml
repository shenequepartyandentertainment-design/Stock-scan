name: Stock Scanner

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy scikit-learn requests
      - name: Run scanner
        run: |
          python - <<'EOF'
          import os
          import requests
          import yfinance as yf
          import pandas as pd
          import numpy as np
          from sklearn.ensemble import RandomForestClassifier

          TICKERS = ["AAPL", "MSFT", "NVDA", "TSLA", "AMD", "AMZN",
                     "META", "GOOGL", "NFLX", "AVGO", "JPM", "COST"]
          HORIZON = 5
          TARGET = 0.02
          YEARS = 3
          TOP_N = 10

          WEBHOOK = os.environ["DISCORD_WEBHOOK"]
          COLS = ["ret1", "ret5", "ret20", "dist_sma50", "vol_ratio", "rsi", "volatility"]

          def features(df):
              c, v = df["Close"], df["Volume"]
              f = pd.DataFrame(index=df.index)
              f["ret1"] = c.pct_change()
              f["ret5"] = c.pct_change(5)
              f["ret20"] = c.pct_change(20)
              f["dist_sma50"] = c / c.rolling(50).mean() - 1
              f["vol_ratio"] = v / v.rolling(20).mean()
              d = c.diff()
              gain = d.clip(lower=0).rolling(14).mean()
              loss = (-d.clip(upper=0)).rolling(14).mean()
              f["rsi"] = 100 - 100 / (1 + gain / loss)
              f["volatility"] = f["ret1"].rolling(20).std()
              return f

          def clean(x):
              return x.replace([np.inf, -np.inf], np.nan).dropna()

          train, latest = [], []
          for t in TICKERS:
              try:
                  df = yf.Ticker(t).history(period=f"{YEARS}y", auto_adjust=True).dropna()
              except Exception:
                  continue
              if len(df) < 120:
                  continue
              f = features(df)
              f["target"] = (df["Close"].shift(-HORIZON) / df["Close"] - 1 > TARGET).astype(int)
              f["ticker"] = t
              f["price"] = df["Close"]
              latest.append(f.iloc[[-1]].drop(columns="target"))
              train.append(f.iloc[:-HORIZON])

          if not train:
              requests.post(WEBHOOK, json={"content": "Scanner error: no data downloaded."})
              raise SystemExit(1)

          train, latest = clean(pd.concat(train)).sort_index(), clean(pd.concat(latest))

          cut = int(len(train) * 0.8)
          a, b = train.iloc[:cut], train.iloc[cut:]
          check = RandomForestClassifier(n_estimators=100, min_samples_leaf=20, random_state=42, n_jobs=-1)
          check.fit(a[COLS], a["target"])
          p = check.predict_proba(b[COLS])[:, 1]
          top = b[p >= np.quantile(p, 0.8)]
          base_rate, top_rate = b["target"].mean(), top["target"].mean()

          model = RandomForestClassifier(n_estimators=200, min_samples_leaf=20, random_state=42, n_jobs=-1)
          model.fit(train[COLS], train["target"])
          latest["score"] = model.predict_proba(latest[COLS])[:, 1]
          out = latest.sort_values("score", ascending=False).head(TOP_N)

          lines = [f"{'TICKER':<7}{'PRICE':>9}{'RSI':>6}{'VOL x':>7}{'SCORE':>7}"]
          for _, r in out.iterrows():
              lines.append(f"{r['ticker']:<7}{r['price']:>9.2f}{r['rsi']:>6.0f}{r['vol_ratio']:>7.1f}{r['score']:>7.2f}")

          msg = (
              f"**AI Scanner** (chance of +{TARGET:.0%} in {HORIZON} days)\n"
              "```\n" + "\n".join(lines) + "\n```\n"
              f"Holdout check: base rate {base_rate:.1%}, model's top 20% {top_rate:.1%}. "
              "If those are close, the scores are mostly noise. Not financial advice."
          )

          r = requests.post(WEBHOOK, json={"content": msg[:1990]})
          r.raise_for_status()
          print("Posted to Discord.")
          EOF

    
#!/usr/bin/env python3

import csv
import os
import time
from datetime import datetime, date
from pathlib import Path

import pandas as pd
import yfinance as yf

# ==================================
# FREE OPTIONS FLOW SCANNER PRO
# ==================================

TICKERS = ["SPY", "QQQ", "AAPL", "TSLA"]

MIN_VOLUME = 100
MIN_PREMIUM = 25000
MIN_VOL_OI = 1.0
MAX_DTE = 14

SCAN_INTERVAL = 180

OUTPUT = Path("output")
OUTPUT.mkdir(exist_ok=True)

CSV_FILE = OUTPUT / "options_flow.csv"


def number(value):
    try:
        if pd.isna(value):
            return 0
        return float(value)
    except:
        return 0


def estimate_side(last, bid, ask):
    if bid <= 0 or ask <= 0 or ask < bid:
        return "UNKNOWN"

    tolerance = max(0.01, (ask - bid) * 0.10)

    if last >= ask - tolerance:
        return "POSSIBLE BUYING AT ASK"

    if last <= bid + tolerance:
        return "POSSIBLE SELLING AT BID"

    return "MID / UNCLEAR"


def scan_stock(symbol):

    print(f"\nScanning {symbol}...")

    stock = yf.Ticker(symbol)

    results = []

    try:
        expirations = stock.options
        price = number(stock.fast_info.get("last_price"))
    except Exception as error:
        print("Data error:", error)
        return results

    if price <= 0:
        return results

    for expiration in expirations:

        exp_date = datetime.strptime(
            expiration, "%Y-%m-%d"
        ).date()

        dte = (exp_date - date.today()).days

        if dte < 0 or dte > MAX_DTE:
            continue

        try:
            chain = stock.option_chain(expiration)
        except Exception:
            continue

        for option_type, contracts in [
            ("CALL", chain.calls),
            ("PUT", chain.puts)
        ]:

            for _, contract in contracts.iterrows():

                volume = number(contract["volume"])
                oi = number(contract["openInterest"])

                last = number(contract["lastPrice"])
                bid = number(contract["bid"])
                ask = number(contract["ask"])

                strike = number(contract["strike"])

                if volume < MIN_VOLUME:
                    continue

                premium = last * volume * 100

                vol_oi = volume / oi if oi > 0 else 0

                side = estimate_side(last, bid, ask)

                reasons = []

                if volume >= MIN_VOLUME:
                    reasons.append("HIGH VOLUME")

                if vol_oi >= MIN_VOL_OI:
                    reasons.append("VOLUME/OI SPIKE")

                if premium >= MIN_PREMIUM:
                    reasons.append("LARGE PREMIUM ESTIMATE")

                if side == "POSSIBLE BUYING AT ASK":
                    reasons.append("POSSIBLE BUYING")

                strong = (
                    volume >= MIN_VOLUME
                    and premium >= MIN_PREMIUM
                    and vol_oi >= MIN_VOL_OI
                )

                if not reasons:
                    continue

                if strong and option_type == "CALL":
                    signal = "HEAVY CALL ACTIVITY"

                elif strong and option_type == "PUT":
                    signal = "HEAVY PUT ACTIVITY"

                else:
                    signal = "WATCH"

                result = {
                    "Time": datetime.now().isoformat(),
                    "Ticker": symbol,
                    "Stock Price": round(price, 2),
                    "Type": option_type,
                    "Expiration": expiration,
                    "DTE": dte,
                    "Strike": strike,
                    "Last": last,
                    "Bid": bid,
                    "Ask": ask,
                    "Volume": int(volume),
                    "Open Interest": int(oi),
                    "Volume/OI": round(vol_oi, 2),
                    "Estimated Premium": round(premium, 2),
                    "Buy Side Estimate": side,
                    "Signal": signal,
                    "Reason": ", ".join(reasons)
                }

                results.append(result)

    return results


def save_results(results):

    if not results:
        return

    file_exists = CSV_FILE.exists()

    with open(CSV_FILE, "a", newline="") as file:

        writer = csv.DictWriter(
            file,
            fieldnames=results[0].keys()
        )

        if not file_exists:
            writer.writeheader()

        writer.writerows(results)


def main():

    print("=" * 55)
    print("       OPTIONS FLOW SCANNER PRO")
    print("=" * 55)

    print("WATCHING:", TICKERS)

    while True:

        all_results = []

        for ticker in TICKERS:

            try:
                results = scan_stock(ticker)
                all_results.extend(results)

            except Exception as error:
                print(ticker, "ERROR:", error)

        if all_results:

            df = pd.DataFrame(all_results)

            df = df.sort_values(
                "Estimated Premium",
                ascending=False
            )

            print("\nOPTIONS FLOW RESULTS")

            print(df.to_string(index=False))

            save_results(all_results)

        else:

            print("\nNO UNUSUAL ACTIVITY DETECTED")

        print(f"\nNext scan in {SCAN_INTERVAL} seconds.")

        time.sleep(SCAN_INTERVAL)


if __name__ == "__main__":
    main()
